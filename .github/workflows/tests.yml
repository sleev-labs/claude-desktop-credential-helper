name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the same checks as a gate before building.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt
      # and clippy) before the checks run.
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Test
        run: cargo test
